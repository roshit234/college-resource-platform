<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | College Resources</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <h1>🎓 College Resources</h1>
    <div>
      <a href="index.html">Home</a>
      <a href="signup.html">Sign Up</a>
    </div>
  </nav>

  <div class="auth-card">
    <h2>Welcome Back</h2>

    <div class="message" id="msg"></div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="rahul@college.com" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Your password" />
    </div>

    <button class="btn" onclick="login()">Login</button>

    <div class="auth-link">
      New here? <a href="signup.html">Create an account</a>
    </div>
  </div>

  <script>
    async function login() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        showMessage('Please fill in all fields', 'error');
        return;
      }

      try {
        const response = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('userName', data.user.name);
          showMessage('Login successful! Redirecting...', 'success');
          setTimeout(() => window.location.href = 'index.html', 1500);
        } else {
          showMessage(data.message, 'error');
        }

      } catch (error) {
        showMessage('Cannot connect to server. Is it running?', 'error');
      }
    }

    function showMessage(text, type) {
      const msg = document.getElementById('msg');
      msg.textContent = text;
      msg.className = `message ${type}`;
      msg.style.display = 'block';
    }
  </script>

</body>
</html>
