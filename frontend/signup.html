<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | College Resources</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <h1>🎓 College Resources</h1>
    <div>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
    </div>
  </nav>

  <div class="auth-card">
    <h2>Create Account</h2>

    <div class="message" id="msg"></div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Rahul Sharma" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="rahul@college.com" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min 6 characters" />
    </div>

    <button class="btn" onclick="signup()">Create Account</button>

    <div class="auth-link">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>

  <script>
    async function signup() {
      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const msg      = document.getElementById('msg');

      // Basic validation
      if (!name || !email || !password) {
        showMessage('Please fill in all fields', 'error');
        return;
      }

      try {
        const response = await fetch('http://localhost:5000/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Save token and user info to browser storage
          localStorage.setItem('token', data.token);
          localStorage.setItem('userName', data.user.name);
          showMessage('Account created! Redirecting...', 'success');
          // Go to home page after 1.5 seconds
          setTimeout(() => window.location.href = 'index.html', 1500);
        } else {
          showMessage(data.message, 'error');
        }

      } catch (error) {
        showMessage('Cannot connect to server. Is it running?', 'error');
      }
    }

    function showMessage(text, type) {
      const msg = document.getElementById('msg');
      msg.textContent = text;
      msg.className = `message ${type}`;
      msg.style.display = 'block';
    }
  </script>

</body>
</html>
